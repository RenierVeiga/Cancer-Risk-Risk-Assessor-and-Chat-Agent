version: '3.8'

services:
  web:
    build: .
    image: cthesigns-app
    ports:
      - "8000:8000"
    volumes:
      # Mount the actual application default credentials directly from the host's gcloud config folder
      - ${APPDATA:-$HOME/.config}/gcloud/application_default_credentials.json:/app/credentials.json
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    restart: unless-stopped
